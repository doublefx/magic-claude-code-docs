name: Tests

on:
  push:
    branches:
      - main
    paths:
      - 'plugin/hooks/**'
      - 'plugin/digest/**'
      - 'plugin/skills/**'
      - 'tests/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'plugin/hooks/**'
      - 'plugin/digest/**'
      - 'plugin/skills/**'
      - 'tests/**'
      - '.github/workflows/test.yml'

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hooks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run version-signal tests
        run: bash tests/version-signal.test.sh

      - name: Run sync-docs tests
        run: bash tests/sync-docs.test.sh

  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm via corepack
        run: corepack enable pnpm

      - name: Install dependencies
        working-directory: plugin/digest
        run: pnpm install --frozen-lockfile

      - name: Run digest tests
        working-directory: plugin/digest
        run: pnpm test
